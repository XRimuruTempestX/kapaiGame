syntax = "proto3";
package Fantasy.Network.Message;

// 协议分为:
// ProtoBuf:可以在Outer和Inner文件里使用。
// MemoryPack:可以在Outer和Inner文件里使用。

// 目前工具支持以下几种特殊用法:
// 在message协议上方添加// Protocol+空格+协议名字
// 例如: // Protocol ProtoBuf 或 // Protocol MemoryPack

// 分别代表使用Protobuf序列化或使用MemoryPack序列化
// 通过添加 // using 导出时添加自定义命名空间
// 例如: // using System.Runtime // using System.Reflection


message C2G_TestMessage // IMessage
{
	string Tag = 1;
}
message C2G_TestRequest // IRequest,G2C_TestResponse
{
	string Tag = 1;
}
message G2C_TestResponse // IResponse
{
	string Tag = 1;
}


//----注册登录 ---------

message C2A_RegisterAccountRequest // IRequest,A2C_RegisterAccountResponse
{
	string account = 1;
	string passWord = 2;
}

message A2C_RegisterAccountResponse // IResponse
{
	int64 userId = 1; //UID
	string account = 2;
	string passWord = 3;
}

message C2A_LoginRequest // IRequest,A2C_LoginResponse
{
	string account = 1;
	string passWprd = 2;
}

message A2C_LoginResponse // IResponse
{
	string gateIp = 1;
	int32 gatePor = 2;
}

message A2C_KickOut // IMessage
{
	int32 reason = 1;     // 踢人原因
	string message = 2;   // 提示信息
}

//--------END------------------